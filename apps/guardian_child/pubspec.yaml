name: guardian_child
description: Druvatara Guardian Child Companion Application
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  go_router: ^17.5.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^10.3.1
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.0
  path_provider: ^2.1.3
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  firebase_analytics: ^12.4.6
  firebase_crashlytics: ^5.2.7
  flutter_local_notifications: ^22.3.0
  local_auth: ^3.0.2
  biometric_storage: ^5.0.1
  permission_handler: ^13.0.1
  url_launcher: ^6.2.6
  qr_code_scanner: ^1.0.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.20.3
  flutter_svg: ^2.0.10
  lottie: ^3.1.0
  collection: ^1.18.0
  equatable: ^2.0.5
  uuid: ^4.4.0
  crypto: ^3.0.3
  pointycastle: ^3.7.0
  encrypt: ^5.0.3
  logger: ^2.3.0
  connectivity_plus: ^7.3.1
  device_info_plus: ^10.0.0
  package_info_plus: ^9.0.1
  app_links: ^6.0.0
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^3.0.0
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  mocktail: ^1.0.3
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700