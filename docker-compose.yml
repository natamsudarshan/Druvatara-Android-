version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: druvatara-postgres
    environment:
      POSTGRES_DB: druvatara
      POSTGRES_USER: druvatara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U druvatara -d druvatara"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: druvatara-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: druvatara-backend
    environment:
      DATABASE_URL: postgresql://druvatara:changeme@postgres:5432/druvatara
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-changeme}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-changeme}
      DEVICE_JWT_SECRET: ${DEVICE_JWT_SECRET:-changeme}
      PORT: 3000
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:3000,http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - /app/node_modules

  # MinIO for object storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: druvatara-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: druvatara
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-changeme}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  minio_data: